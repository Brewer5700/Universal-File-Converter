<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Universal File Converter</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="header">
    <div>
      <h1>Universal File Converter</h1>
      <p>Convert documents, images, audio, video, ebooks, and archives locally.</p>
    </div>
    <div class="api-key">
      <label for="apiKey">API Key (optional)</label>
      <input id="apiKey" type="password" placeholder="Enter API key" />
    </div>
  </header>

  <main class="container">
    <section class="card">
      <h2>1. Upload Files</h2>
      <div id="dropZone" class="drop-zone">
        <p>Drag &amp; drop files here</p>
        <span>or</span>
        <label class="button" for="fileInput">Choose files</label>
        <input id="fileInput" type="file" multiple />
      </div>
      <ul id="fileList" class="file-list"></ul>
    </section>

    <section class="card">
      <h2>2. Choose Output Format</h2>
      <div class="format-controls">
        <input id="formatSearch" type="search" placeholder="Search formats" />
        <input id="targetFormat" type="text" placeholder="Target format (e.g., pdf)" />
      </div>
      <div id="supportedInfo" class="supported-info"></div>
      <div id="formatList" class="format-list"></div>
    </section>

    <section class="card">
      <h2>3. Convert</h2>
      <button id="convertButton" class="button primary">Start Conversion</button>
      <div id="status" class="status"></div>
      <div class="progress">
        <div id="progressBar" class="progress-bar"></div>
      </div>
      <div id="results" class="results"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
